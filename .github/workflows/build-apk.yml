name: Build Android APK

on:
  push:
    branches: [main, master, gameplay-overhaul]
  pull_request:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Validate game JavaScript
        run: |
          node --check www/game.js
          node --check www/game-enhancements.js

      - name: Install dependencies
        run: npm install

      - name: Create Android project
        run: npx cap add android

      - name: Lock screen to portrait
        run: sed -i 's/<activity/<activity android:screenOrientation="portrait"/' android/app/src/main/AndroidManifest.xml

      - name: Allow vibration
        run: sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#&\n    <uses-permission android:name="android.permission.VIBRATE" />#' android/app/src/main/AndroidManifest.xml

      - name: Sync game files
        run: npx cap sync android

      - name: Build APK
        run: |
          chmod +x android/gradlew
          cd android
          ./gradlew assembleDebug

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: deep-catch-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Publish release with direct APK link
        if: github.event_name == 'push' && (github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master')
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk deep-catch.apk
          gh release delete latest --cleanup-tag -y || true
          gh release create latest deep-catch.apk --title "Deep Catch (latest)" --notes "Latest auto-built APK" --target ${{ github.sha }}
